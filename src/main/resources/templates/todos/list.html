<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Todos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <aside class="sidebar">
        <a th:href="@{/}" class="sidebar-brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
            </div>
            <span class="brand-label">Todo-App</span>
        </a>

        <nav class="sidebar-nav">
            <div class="nav-section">Menu</div>

            <a th:href="@{/}" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
                </svg>
                All Todos
                <span class="nav-count" th:if="${totalItems != null}" th:text="${totalItems}">0</span>
            </a>

            <a th:href="@{/new}" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v8M8 12h8"/>
                </svg>
                New Todo
            </a>

            <div class="divider" style="margin: 12px 0;"></div>
        </nav>

        <div class="sidebar-footer">
            &copy; 2026 TodoApp &mdash; All rights reserved. with love from us
        </div>
    </aside>

    <!-- ── Main ───────────────────────────────────────── -->
    <main class="main">
        <div class="main-inner">

            <!-- Header -->
            <div class="page-hd">
                <div>
                    <h1 class="page-title">My Todos</h1>
                    <p class="page-sub" th:if="${totalItems != null}"
                       th:text="${totalItems + ' item' + (totalItems != 1 ? 's' : '')}"></p>
                </div>
                <a th:href="@{/new}" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    New Todo
                </a>
            </div>

            <!-- Search -->
            <form th:action="@{/}" method="get" class="search-row">
                <div class="search-wrap">
                    <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" name="keyword" class="search-input"
                           th:value="${keyword}"
                           placeholder="Search todos by title or content…">
                </div>
                <button type="submit" class="btn btn-secondary">Search</button>
                <a th:href="@{/}" class="btn-clear"
                   th:if="${keyword != null and !keyword.isEmpty()}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                    Clear
                </a>
            </form>

            <!-- Stats bar -->
            <div class="stats-bar" th:if="${totalItems != null and totalItems > 0}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px">
                    <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
                <span th:text="${totalItems + ' todo' + (totalItems != 1 ? 's' : '') + (keyword != null and !keyword.isEmpty() ? ' matching &quot;' + keyword + '&quot;' : '')}"></span>
            </div>

            <!-- Empty state -->
            <div class="empty-state" th:if="${todos.empty}">
                <div class="empty-art">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                        <rect x="9" y="3" width="6" height="4" rx="1"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <p class="empty-title"
                   th:text="${keyword != null and !keyword.isEmpty()} ? 'No results found' : 'No todos yet'"></p>
                <p class="empty-text"
                   th:text="${keyword != null and !keyword.isEmpty()} ? 'Try a different keyword or clear the search filter.' : 'You\'re all clear! Create your first todo to get started.'"></p>
                <a th:href="@{/new}" class="btn btn-primary"
                   th:if="${keyword == null or keyword.isEmpty()}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Create your first todo
                </a>
                <a th:href="@{/}" class="btn btn-secondary"
                   th:if="${keyword != null and !keyword.isEmpty()}">Clear search</a>
            </div>

            <!-- Grid -->
            <div class="todos-grid" th:if="${!todos.empty}">
                <div th:each="todo : ${todos}" class="todo-card">

                    <a th:href="@{/view/{id}(id=${todo.id})}" class="todo-card-body-wrap">
                        <div class="todo-card-top">
                            <span class="todo-card-title" th:text="${todo.title}">Title</span>
                            <span th:if="${todo.category}" class="badge badge-category"
                                  th:text="${todo.category.name}">Cat</span>
                        </div>
                        <p class="todo-card-preview" th:text="${todo.content}">Content…</p>
                        <div class="todo-card-tags" th:if="${todo.tags != null and !todo.tags.isEmpty()}">
                            <span th:each="tag : ${todo.tags}"
                                  class="badge badge-tag" th:text="${tag.name}">tag</span>
                        </div>
                    </a>

                    <div class="todo-card-footer">
                        <span class="todo-card-date">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2"/>
                                <line x1="16" y1="2" x2="16" y2="6"/>
                                <line x1="8" y1="2" x2="8" y2="6"/>
                                <line x1="3" y1="10" x2="21" y2="10"/>
                            </svg>
                            <span th:text="${#temporals.format(todo.createdAt, 'MMM d, yyyy')}">Date</span>
                        </span>
                        <div class="todo-card-actions">
                            <a th:href="@{/edit/{id}(id=${todo.id})}" class="btn btn-ghost btn-xs">Edit</a>
                            <a th:href="@{/delete/{id}(id=${todo.id})}" class="btn btn-ghost-danger btn-xs"
                               onclick="return confirm('Delete this todo? This cannot be undone.')">Delete</a>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/(keyword=${keyword}, page=${currentPage - 1})}"
                   th:classappend="${currentPage == 0} ? 'disabled'"
                   class="pg-btn">&lsaquo;</a>

                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/(keyword=${keyword}, page=${i})}"
                       th:text="${i + 1}"
                       th:classappend="${currentPage == i} ? 'active'"
                       class="pg-btn">1</a>
                </th:block>

                <a th:href="@{/(keyword=${keyword}, page=${currentPage + 1})}"
                   th:classappend="${currentPage == totalPages - 1} ? 'disabled'"
                   class="pg-btn">&rsaquo;</a>
            </div>

        </div>
    </main>

</div>
</body>
</html>
